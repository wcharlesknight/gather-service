server:
  port: 8080

spring:
  application:
    name: gather-service

# Google Places API Configuration
google:
  places:
    api:
      api-key: ${GOOGLE_PLACES_API_KEY:your-api-key-here}
      base-url: https://places.googleapis.com/v1
      default-field-mask: "places.id,places.displayName,places.formattedAddress,places.location,places.rating,places.userRatingCount,places.nationalPhoneNumber,places.googleMapsUri"

# Generic Place Search Service Configuration
# This allows easy switching between providers (currently: google, or future providers)
place-service:
  active-provider: ${PLACE_SERVICE_PROVIDER:google}  # Options: "google" (or future providers)
  admin:
    enabled: ${PLACE_SERVICE_ADMIN_ENABLED:true}  # Exposes POST /api/admin/jobs/weekly-gather for manual triggering. Set to false in prod.
  job:
    enabled: true
    cron: "0 0 9 * * THU"  # Every Thursday at 9:00 AM (for Friday gatherings)
    timezone: "America/Los_Angeles"  # Timezone the cron fires in (independent of server/JVM zone)
    default-location: "Seattle, WA"
    default-term: "bars"
    search-limit: 20  # Google Places API max is 20
    avoid-repeat-weeks: 12  # Don't repeat spots selected in last 12 weeks

# Resend Email Configuration
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@gather.app}
  enabled: ${RESEND_ENABLED:true}

# Firebase Configuration for Push Notifications
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
  enabled: ${FIREBASE_ENABLED:true}
  notification-topic: weekly-gather

# Logging
logging:
  level:
    com.gather: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
